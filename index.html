<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Primakus & Dravox</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080e;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;height:100vh;width:100vw;cursor:default}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* MENU */
#menu{display:flex;width:100%;height:100vh;position:relative;z-index:1}
.panel{flex:1;position:relative;overflow:hidden;cursor:pointer;transition:flex 0.8s cubic-bezier(0.77,0,0.175,1)}
.panel:hover{flex:1.45}
.panel-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(0.77,0,0.175,1),filter 0.8s;filter:brightness(0.2) saturate(0.4) blur(2px)}
.panel:hover .panel-img{transform:scale(1.1);filter:brightness(0.35) saturate(1.2) blur(0px)}
.divider{position:absolute;left:50%;top:0;width:1px;height:100%;background:linear-gradient(to bottom,transparent 5%,rgba(180,130,255,0.3) 50%,transparent 95%);z-index:2;pointer-events:none}
.divider::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;background:rgba(200,150,255,0.6);border-radius:50%;box-shadow:0 0 12px rgba(200,150,255,0.8)}

.panel-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.panel-line{width:1.5px;height:0;transition:height 0.7s cubic-bezier(0.77,0,0.175,1);margin-bottom:6px;border-radius:2px}
.panel-dravox .panel-line{background:linear-gradient(to bottom,transparent,#38bdf8,#93c5fd,transparent)}
.panel-primakus .panel-line{background:linear-gradient(to bottom,transparent,#a78bfa,#f472b6,transparent)}
.panel:hover .panel-line{height:90px}

.panel-name{font-family:'Rajdhani',sans-serif;font-size:clamp(48px,6vw,80px);font-weight:700;letter-spacing:8px;transition:letter-spacing 0.5s,opacity 0.4s;opacity:0.85}
.panel:hover .panel-name{letter-spacing:12px;opacity:1}
.panel-primakus .panel-name{color:#c4b5fd;text-shadow:0 0 40px rgba(167,139,250,0.4)}
.panel-dravox .panel-name{color:#7dd3fc;text-shadow:0 0 40px rgba(56,189,248,0.4)}

.panel-sub{font-size:11px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,0.35);transition:color 0.4s}
.panel:hover .panel-sub{color:rgba(255,255,255,0.6)}

.panel-enter{margin-top:20px;font-size:10px;letter-spacing:5px;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:opacity 0.4s 0.1s,transform 0.4s 0.1s}
.panel-primakus:hover .panel-enter{opacity:1;transform:translateY(0);color:rgba(196,181,253,0.7)}
.panel-dravox:hover .panel-enter{opacity:1;transform:translateY(0);color:rgba(125,211,252,0.7)}

.panel-corner{position:absolute;width:20px;height:20px;opacity:0;transition:opacity 0.4s}
.panel-corner.tl{top:24px;left:24px;border-top:1.5px solid;border-left:1.5px solid}
.panel-corner.tr{top:24px;right:24px;border-top:1.5px solid;border-right:1.5px solid}
.panel-corner.bl{bottom:24px;left:24px;border-bottom:1.5px solid;border-left:1.5px solid}
.panel-corner.br{bottom:24px;right:24px;border-bottom:1.5px solid;border-right:1.5px solid}
.panel-primakus .panel-corner{border-color:rgba(196,181,253,0.5)}
.panel-dravox .panel-corner{border-color:rgba(125,211,252,0.5)}
.panel:hover .panel-corner{opacity:1}

/* PAGES */
.page{display:none;position:fixed;inset:0;z-index:10;overflow-y:auto;background:#08080e}
.page.active{display:block;animation:pageIn 0.6s cubic-bezier(0.77,0,0.175,1) forwards}
@keyframes pageIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}

.page-bg{position:fixed;inset:0;z-index:0}
.page-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.06) saturate(0.3)}
.page-bg-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(8,8,14,0.8) 100%)}
.bg-glow-primakus{position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(139,92,246,0.12) 0%,transparent 55%)}
.bg-glow-dravox{position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(14,165,233,0.12) 0%,transparent 55%)}

.page-content{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:90px 20px 80px}

/* BACK BUTTON */
.back-btn{position:fixed;top:24px;left:24px;z-index:20;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);font-family:'Inter',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:9px 18px;border-radius:2px;cursor:pointer;transition:all 0.3s;backdrop-filter:blur(8px)}
.back-btn-primakus:hover{background:rgba(139,92,246,0.1);border-color:rgba(196,181,253,0.4);color:#c4b5fd}
.back-btn-dravox:hover{background:rgba(14,165,233,0.1);border-color:rgba(125,211,252,0.4);color:#7dd3fc}

/* LIKE BUTTON */
.like-btn{position:fixed;top:24px;right:24px;z-index:20;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.1);border-radius:40px;padding:7px 16px 7px 8px;cursor:pointer;transition:all 0.3s;backdrop-filter:blur(8px);user-select:none}
.like-btn:hover:not(.liked){border-color:rgba(255,100,130,0.4);background:rgba(255,100,130,0.05);transform:scale(1.04)}
.like-btn.liked{border-color:rgba(255,100,130,0.5)}
.like-icon{width:32px;height:32px;object-fit:contain;transition:transform 0.3s}
.like-btn:not(.liked):hover .like-icon{transform:scale(1.2) rotate(-8deg)}
.like-count{font-size:15px;font-weight:500;color:white;min-width:18px}
.like-badge{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,100,130,0.6)}

/* HEART PARTICLES */
.heart-particle{position:fixed;top:-40px;pointer-events:none;z-index:999;animation:fallDown 2.8s ease-in forwards}
@keyframes fallDown{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}80%{opacity:0.8}100%{transform:translateY(110vh) rotate(720deg) scale(0.5);opacity:0}}

/* PAGE HEADER */
.page-tag{font-size:10px;letter-spacing:6px;text-transform:uppercase;margin-bottom:20px}
.tag-primakus{color:rgba(196,181,253,0.5)}
.tag-dravox{color:rgba(125,211,252,0.5)}
.page-title{font-family:'Rajdhani',sans-serif;font-size:clamp(64px,12vw,110px);font-weight:700;letter-spacing:10px;line-height:1;margin-bottom:6px}
.title-primakus{color:#c4b5fd;text-shadow:0 0 80px rgba(139,92,246,0.3)}
.title-dravox{color:#7dd3fc;text-shadow:0 0 80px rgba(14,165,233,0.3)}
.page-role{font-size:11px;font-weight:300;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:56px}

.sep{width:40px;height:1px;margin-bottom:52px}
.sep-primakus{background:linear-gradient(to right,transparent,rgba(196,181,253,0.4),transparent)}
.sep-dravox{background:linear-gradient(to right,transparent,rgba(125,211,252,0.4),transparent)}

/* LINKS */
.links{display:flex;flex-direction:column;width:100%;max-width:480px;gap:10px}
.link-item{display:flex;align-items:center;gap:18px;padding:22px 28px;text-decoration:none;color:rgba(255,255,255,0.55);font-size:13px;font-weight:500;letter-spacing:5px;text-transform:uppercase;position:relative;overflow:hidden;border-radius:8px;transition:all 0.35s cubic-bezier(0.25,0.46,0.45,0.94);background:rgba(255,255,255,0.025);border:0.5px solid rgba(255,255,255,0.07)}
.link-item::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.4s}
.link-primakus::before{background:linear-gradient(120deg,rgba(139,92,246,0.12),rgba(244,114,182,0.08),transparent)}
.link-dravox::before{background:linear-gradient(120deg,rgba(14,165,233,0.12),rgba(125,211,252,0.08),transparent)}
.link-item:hover{color:rgba(255,255,255,0.9);transform:translateX(6px);border-color:rgba(255,255,255,0.14)}
.link-item:hover::before{opacity:1}
.link-primakus:hover{border-color:rgba(196,181,253,0.25);box-shadow:0 4px 32px rgba(139,92,246,0.08),inset 0 0 0 0.5px rgba(196,181,253,0.15)}
.link-dravox:hover{border-color:rgba(125,211,252,0.25);box-shadow:0 4px 32px rgba(14,165,233,0.08),inset 0 0 0 0.5px rgba(125,211,252,0.15)}
.link-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;opacity:0;transition:opacity 0.3s,transform 0.3s;transform:scale(0)}
.link-primakus .link-dot{background:radial-gradient(circle,#c4b5fd,#a78bfa)}
.link-dravox .link-dot{background:radial-gradient(circle,#7dd3fc,#38bdf8)}
.link-item:hover .link-dot{opacity:1;transform:scale(1)}
.link-logo{width:28px;height:28px;object-fit:contain;opacity:0.5;transition:opacity 0.3s,transform 0.3s;flex-shrink:0;border-radius:6px}
.link-item:hover .link-logo{opacity:1;transform:scale(1.08)}
.link-text{flex:1}
.link-arrow{font-size:18px;opacity:0;transition:opacity 0.3s,transform 0.3s;letter-spacing:0}
.link-primakus .link-arrow{color:#c4b5fd}
.link-dravox .link-arrow{color:#7dd3fc}
.link-item:hover .link-arrow{opacity:1;transform:translateX(4px)}

/* SCAN LINE */
.scan-line{position:fixed;top:0;left:0;right:0;height:1px;background:rgba(196,181,253,0.1);z-index:5;pointer-events:none;animation:scanDown 8s linear infinite}
@keyframes scanDown{0%{top:-1%}100%{top:101%}}
</style>
</head>

<script>
/* PARTICULES */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, dots = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initDots() {
  dots = [];
  for (let i = 0; i < 120; i++) {
    dots.push({
      x:    Math.random() * W,
      y:    Math.random() * H,
      r:    Math.random() * 1.4 + 0.3,
      vx:   (Math.random() - 0.5) * 0.25,
      vy:   (Math.random() - 0.5) * 0.25,
      o:    Math.random() * 0.45 + 0.08,
      hue:  Math.random() > 0.5 ? 260 : 200
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let d of dots) {
    d.x += d.vx; d.y += d.vy;
    if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
    if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue}, 80%, 75%, ${d.o})`;
    ctx.fill();
  }
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 110) {
        const h = dots[i].hue === dots[j].hue ? dots[i].hue : 230;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.strokeStyle = `hsla(${h}, 70%, 70%, ${0.1 * (1 - dist / 110)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}

resize(); initDots(); draw();
window.addEventListener('resize', () => { resize(); initDots(); });

/* NAVIGATION */
function openPage(who) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById(who + '-page').classList.add('active');
}

function goBack() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('menu').style.display = 'flex';
}

/* LIKES — Firebase Realtime Database */
// ⚠️ REMPLACE ces valeurs par les tiennes depuis la console Firebase
const FB_URL = 'https://primakus-dravox-default-rtdb.firebaseio.com';

const cooldown = {}; // anti-spam par profil

// Charger les vrais compteurs depuis Firebase au démarrage
['primakus', 'dravox'].forEach(who => {
  fetch(`${FB_URL}/likes/${who}.json`)
    .then(r => r.json())
    .then(val => {
      const count = val || 0;
      document.getElementById('like-count-' + who).textContent = count;
    })
    .catch(() => {});

  // Restaurer l'état liked depuis localStorage (propre à chaque navigateur)
  if (localStorage.getItem('liked_' + who) === 'true') {
    document.getElementById('like-btn-' + who).classList.add('liked');
    document.getElementById('like-icon-' + who).style.filter = 'hue-rotate(320deg) saturate(2) brightness(1.2)';
  }
});

function doLike(who) {
  // Cooldown 1 seconde anti-crash
  if (cooldown[who]) return;
  cooldown[who] = true;
  setTimeout(() => cooldown[who] = false, 1000);

  const already = localStorage.getItem('liked_' + who) === 'true';
  const btn  = document.getElementById('like-btn-' + who);
  const icon = document.getElementById('like-icon-' + who);
  const delta = already ? -1 : 1;

  // Mise à jour Firebase avec transaction atomique
  fetch(`${FB_URL}/likes/${who}.json`)
    .then(r => r.json())
    .then(current => {
      const newVal = Math.max(0, (current || 0) + delta);
      return fetch(`${FB_URL}/likes/${who}.json`, {
        method: 'PUT',
        body: JSON.stringify(newVal)
      }).then(() => newVal);
    })
    .then(newVal => {
      document.getElementById('like-count-' + who).textContent = newVal;

      if (already) {
        localStorage.removeItem('liked_' + who);
        btn.classList.remove('liked');
        icon.style.filter = '';
        icon.style.transform = 'scale(0.85)';
        setTimeout(() => icon.style.transform = 'scale(1)', 250);
      } else {
        localStorage.setItem('liked_' + who, 'true');
        btn.classList.add('liked');
        icon.style.filter = 'hue-rotate(320deg) saturate(2) brightness(1.2)';
        icon.style.transform = 'scale(1.5)';
        setTimeout(() => icon.style.transform = 'scale(1)', 300);
        spawnHearts();
      }
    })
    .catch(() => {
      // Si Firebase down, fallback localStorage
      const local = parseInt(localStorage.getItem('likes_' + who) || '0');
      const newVal = Math.max(0, local + delta);
      localStorage.setItem('likes_' + who, newVal);
      document.getElementById('like-count-' + who).textContent = newVal;
    });
}

function spawnHearts() {
  const emojis = ['❤️', '💜', '💙', '💖', '🩷', '✨', '💫'];
  const count  = 25;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (14 + Math.random() * 20) + 'px';
      const dur = 2 + Math.random() * 1.5;
      heart.style.animationDuration = dur + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), dur * 1000);
    }, i * 70);
  }
}
</script>
</body>
