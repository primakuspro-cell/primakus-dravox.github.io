<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #0a0a0f;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  #menu {
    display: flex;
    width: 100%;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  .panel {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: flex 0.7s cubic-bezier(0.77,0,0.175,1);
  }

  .panel:hover { flex: 1.4; }

  .panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1s cubic-bezier(0.77,0,0.175,1), filter 0.7s;
    filter: brightness(0.35) saturate(0.7);
  }

  .panel:hover img {
    transform: scale(1.08);
    filter: brightness(0.5) saturate(1.1);
  }

  .panel-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }

  .panel-line {
    width: 2px;
    height: 0;
    background: linear-gradient(to bottom, transparent, #c084fc, #f472b6, transparent);
    transition: height 0.6s ease;
    margin-bottom: 8px;
  }

  .panel:hover .panel-line { height: 80px; }

  .panel-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #e879f9, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0.2;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
  }

  .panel:hover .panel-name {
    opacity: 1;
    transform: translateY(0);
  }

  .panel-sub {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0);
    transition: color 0.5s 0.1s;
  }

  .panel:hover .panel-sub { color: rgba(255,255,255,0.55); }

  .panel-enter {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0);
    transition: color 0.4s 0.15s;
  }

  .panel:hover .panel-enter { color: rgba(192,132,252,0.8); }

  .panel-enter::after {
    content: '';
    width: 0;
    height: 1px;
    background: #c084fc;
    transition: width 0.4s 0.2s;
  }

  .panel:hover .panel-enter::after { width: 32px; }

  .divider {
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 5%, rgba(192,132,252,0.25) 50%, transparent 95%);
    z-index: 2;
    pointer-events: none;
  }

  .page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow-y: auto;
    background: #0a0a0f;
  }

  .page.active { display: block; }

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .page-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.08) saturate(0.5);
  }

  .page-bg-gradient {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(168,85,247,0.15) 0%, transparent 60%);
  }

  .page-content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 20px 60px;
  }

  .back-btn {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 20;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(192,132,252,0.2);
    color: rgba(255,255,255,0.6);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .back-btn:hover {
    background: rgba(192,132,252,0.1);
    border-color: rgba(192,132,252,0.5);
    color: #c084fc;
  }

  .page-tag {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(192,132,252,0.6);
    margin-bottom: 16px;
  }

  .page-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 96px;
    font-weight: 700;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #f0abfc, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
  }

  .page-role {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 60px;
  }

  .sep {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(192,132,252,0.5), transparent);
    margin-bottom: 60px;
  }

  .links { display: flex; flex-direction: column; gap: 0; width: 100%; max-width: 420px; }

  .link-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 28px;
    text-decoration: none;
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    transition: color 0.3s, padding-left 0.3s;
  }

  .link-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 0;
    background: linear-gradient(to right, rgba(168,85,247,0.08), transparent);
    transition: width 0.4s;
  }

  .link-item:hover::before { width: 100%; }

  .link-item:hover {
    color: rgba(255,255,255,0.95);
    padding-left: 36px;
  }

  .link-accent {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 0;
    background: linear-gradient(to bottom, #c084fc, #f472b6);
    opacity: 0;
    transition: height 0.3s, opacity 0.3s;
  }

  .link-item:hover .link-accent { height: 60%; opacity: 1; }

  .link-logo {
    width: 24px;
    height: 24px;
    object-fit: contain;
    opacity: 0.5;
    transition: opacity 0.3s;
    flex-shrink: 0;
  }

  .link-item:hover .link-logo { opacity: 1; }

  .link-arrow {
    margin-left: auto;
    font-size: 16px;
    color: rgba(192,132,252,0);
    transition: color 0.3s, transform 0.3s;
  }

  .link-item:hover .link-arrow {
    color: rgba(192,132,252,0.7);
    transform: translateX(4px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .page.active .page-content { animation: fadeIn 0.6s ease forwards; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

  </div>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W, H, dots = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initDots() {
  dots = [];
  for (let i = 0; i < 90; i++) {
    dots.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      o: Math.random() * 0.5 + 0.1
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let d of dots) {
    d.x += d.vx; d.y += d.vy;
    if (d.x < 0) d.x = W;
    if (d.x > W) d.x = 0;
    if (d.y < 0) d.y = H;
    if (d.y > H) d.y = 0;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(192,132,252,${d.o})`;
    ctx.fill();
  }
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.strokeStyle = `rgba(168,85,247,${0.12 * (1 - dist/120)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}

resize(); initDots(); draw();
window.addEventListener('resize', () => { resize(); initDots(); });

function openPage(who) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById(who + '-page').classList.add('active');
}

function goBack() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('menu').style.display = 'flex';
}
</script>
